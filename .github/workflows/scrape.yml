name: Scrape jobs

on:
  schedule:
    # Every 6 hours at :15 — offset avoids the top-of-hour Actions rush.
    - cron: "15 */6 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > scraper/service-account.json

      - name: Scrape and upload
        env:
          SCRAPE_HOURS_OLD: "24"
          SCRAPE_RESULTS_PER_QUERY: "60"
          FIREBASE_SERVICE_ACCOUNT: scraper/service-account.json
        run: python scraper/scrape_and_upload.py

      - name: Cleanup key
        if: always()
        run: rm -f scraper/service-account.json
